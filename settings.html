<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080B12">
  <title>Pengaturan Akun | MARKET INSIGHT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root{--bg:#080B12;--panel:#0e1420;--line:rgba(255,255,255,.09);--muted:#8994a7;--cyan:#00F0FF;--white:#f5f8fc}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -10%,rgba(0,240,255,.13),transparent 42%),radial-gradient(ellipse at 100% 100%,rgba(37,99,235,.12),transparent 35%),var(--bg);color:var(--white);font-family:"Plus Jakarta Sans",sans-serif;display:flex;flex-direction:column}
    a{color:var(--cyan);text-decoration:none}.topbar{height:78px;padding:0 clamp(20px,5vw,72px);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.05)}
    .brand{display:flex;align-items:center;gap:12px;color:#fff;font-size:15px;font-weight:800;letter-spacing:1.2px}.brand-icon{width:34px;height:34px;border:1px solid rgba(0,240,255,.3);background:rgba(0,240,255,.09);border-radius:10px;display:grid;place-items:center;color:var(--cyan)}
    .top-link{font-size:13px;color:#aab4c4}.top-link:hover{color:var(--cyan)}
    main{width:100%;max-width:560px;margin:auto;padding:54px 22px;flex:1;display:flex;align-items:center}
    .card{width:100%;background:linear-gradient(145deg,rgba(255,255,255,.055),rgba(255,255,255,.018));border:1px solid var(--line);border-radius:22px;padding:34px;box-shadow:0 24px 80px rgba(0,0,0,.28);backdrop-filter:blur(18px)}
    .card-head{margin-bottom:25px}.card-head h1{font-size:27px;margin:0 0 9px}.card-head p{font-size:13px;color:var(--muted);margin:0;line-height:1.7}
    .field{margin:18px 0}.field label{display:block;font-size:12px;font-weight:700;color:#d5dce7;margin-bottom:9px}.input-wrap{position:relative}.input-wrap i.leading{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#78869b;font-size:14px}
    .field input{width:100%;height:49px;background:rgba(3,7,14,.65);border:1px solid rgba(255,255,255,.11);border-radius:10px;color:#fff;padding:0 16px 0 42px;font:inherit;font-size:13px;outline:none;transition:.2s}
    .field input:focus{border-color:rgba(0,240,255,.65);box-shadow:0 0 0 3px rgba(0,240,255,.08)}
    .field input:disabled{color:#6b7689;cursor:not-allowed}
    .hint{font-size:11px;color:#778398;margin-top:7px;line-height:1.5}
    .submit{width:100%;height:49px;border:0;border-radius:10px;background:var(--cyan);color:#061018;font:inherit;font-size:13px;font-weight:800;cursor:pointer;margin-top:10px;transition:.2s}
    .submit:hover{background:#70f7ff}.submit:disabled{opacity:.55;cursor:wait}
    .message{display:none;margin:16px 0 0;padding:12px 13px;border-radius:9px;font-size:12px;line-height:1.6}.message.show{display:block}
    .message.error{color:#ffb4b4;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.22)}
    .message.success{color:#9af5cf;background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.22)}
    .divider{height:1px;background:var(--line);margin:25px 0 20px}
    .bottom{text-align:center;font-size:12px;color:var(--muted)}.bottom a{font-weight:700}
    .skeleton{height:49px;border-radius:10px;background:linear-gradient(90deg,rgba(255,255,255,.04) 25%,rgba(255,255,255,.09) 37%,rgba(255,255,255,.04) 63%);background-size:400% 100%;animation:shimmer 1.4s ease infinite}
    @keyframes shimmer{0%{background-position:100% 0}100%{background-position:-100% 0}}
    footer{text-align:center;padding:20px;color:#596477;font-size:10px;border-top:1px solid rgba(255,255,255,.04)}
    @media(max-width:420px){.topbar{height:66px;padding:0 17px}.brand{font-size:12px}.card{padding:26px 20px}}
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html"><span class="brand-icon"><i class="fa-solid fa-chart-line"></i></span><span>MARKET INSIGHT</span></a>
    <a class="top-link" href="index.html">&larr; Kembali ke Beranda</a>
  </header>

  <main>
    <section class="card">
      <div class="card-head">
        <h1>Pengaturan Akun</h1>
        <p>Ubah nama tampilan dan username kamu di MARKET INSIGHT.</p>
      </div>

      <form id="settingsForm" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <div class="input-wrap"><i class="fa-regular fa-envelope leading"></i><input id="email" type="email" disabled></div>
          <div class="hint">Email tidak bisa diubah di sini.</div>
        </div>
        <div class="field">
          <label for="displayName">Nama tampilan</label>
          <div class="input-wrap"><i class="fa-regular fa-user leading"></i><input id="displayName" type="text" placeholder="Nama kamu" maxlength="60" required></div>
        </div>
        <div class="field">
          <label for="username">Username</label>
          <div class="input-wrap"><i class="fa-solid fa-at leading"></i><input id="username" type="text" placeholder="contoh: trader_va" minlength="3" maxlength="24" pattern="[a-z0-9_]+" required></div>
          <div class="hint">3–24 karakter, huruf kecil, angka, dan underscore saja.</div>
        </div>
        <button class="submit" id="saveButton" type="submit" disabled>Simpan Perubahan</button>
        <div class="message" id="formMessage" role="status" aria-live="polite"></div>
      </form>

      <div class="divider"></div>
      <div class="bottom"><a href="index.html">&larr; Kembali ke Beranda</a></div>
    </section>
  </main>
  <footer>© <span id="year"></span> MARKET INSIGHT. ALL RIGHTS RESERVED.</footer>

  <!-- Supabase Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Supabase Configuration -->
  <script src="js/supabase.js"></script>
  <!-- Authentication -->
  <script src="js/auth.js"></script>
  <!-- Settings page logic (Stage 07.6) -->
  <script src="js/settings.js"></script>
</body>
</html>
