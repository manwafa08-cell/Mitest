<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080b12">
<title id="pageTitle">Artikel | MARKET INSIGHT</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#080b12;--cyan:#00f0ff;--muted:#8793a5;--line:rgba(255,255,255,.09);--panel:rgba(255,255,255,.035);--green:#20d6a0;--red:#ff667d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f4f7fb;font-family:"Plus Jakarta Sans",sans-serif;background-image:radial-gradient(ellipse at 50% -15%,rgba(0,240,255,.13),transparent 45%)}
a{color:inherit;text-decoration:none}.wrap{width:min(760px,calc(100% - 40px));margin:auto}

/* Compatibility styles for #navAuthArea (non-Tailwind page) */
#navAuthArea{display:flex;align-items:center;gap:12px}
#navAuthArea a[href="login.html"],#navAuthArea a[href="settings.html"]{color:#9ca3af;font-size:.875rem;font-weight:600;transition:color .2s}
#navAuthArea a[href="login.html"]:hover,#navAuthArea a[href="settings.html"]:hover{color:#00f0ff}
#navAuthArea a[href="register.html"]{font-size:.75rem;font-weight:700;padding:8px 16px;border-radius:9999px;background:#00f0ff;color:#080b12;transition:background .2s}
#navAuthArea a[href="register.html"]:hover{background:#00d5e3}
#navAuthArea span{color:#d1d5db;font-size:.875rem;font-weight:600}
#navLogoutBtn{font-size:.75rem;font-weight:700;padding:8px 16px;border-radius:9999px;border:1px solid rgba(0,240,255,.3);background:transparent;color:#00f0ff;transition:all .2s;cursor:pointer}
#navLogoutBtn:hover{background:#00f0ff;color:#080b12}
@media(max-width:640px){#navAuthArea span,#navLogoutBtn span{display:none}}

.panel{background:linear-gradient(145deg,rgba(255,255,255,.055),rgba(255,255,255,.018));border:1px solid var(--line);border-radius:17px;padding:22px;backdrop-filter:blur(14px)}
.label{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:800}.hint{font-size:11px;color:var(--muted);line-height:1.7}.cyan{color:var(--cyan)}
.article-cat{font-size:10px;font-weight:800;color:var(--cyan);text-transform:uppercase;letter-spacing:.08em;background:rgba(0,240,255,.08);border:1px solid rgba(0,240,255,.2);border-radius:20px;padding:4px 10px}
.article-head{margin:30px 0 24px}
.article-meta{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.article-date{font-size:11px;color:var(--muted)}
.article-title{font-size:clamp(22px,4vw,32px);font-weight:800;line-height:1.3;margin:0 0 18px;letter-spacing:-.02em}
.article-author{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);padding-bottom:22px;border-bottom:1px solid var(--line);margin-bottom:28px}
.article-body p{margin:0 0 20px;line-height:1.85;color:#dde3ec;font-size:15px}
.article-sources{margin-top:30px;padding-top:18px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}
.cta{margin-top:34px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.cta a{color:#4fb3e8;font-weight:800;font-size:12px}
.state{text-align:center;color:var(--muted);padding:60px 0;font-size:13px}
footer{margin-top:55px;padding:25px 0;border-top:1px solid var(--line);text-align:center;color:#657184;font-size:10px;line-height:1.8}
@media(max-width:560px){.wrap{width:calc(100% - 28px)}.panel{padding:16px}}
</style>
</head>
<body>

<!-- Centralized Navigation -->
<div id="app-navbar"></div>

<main class="wrap">

<div class="state" id="loadingState">Memuat artikel...</div>
<div class="state" id="notFoundState" style="display:none">
    Artikel tidak ditemukan.<br><br>
    <a href="insight.html" class="cyan" style="font-weight:800">← Kembali ke daftar artikel</a>
</div>

<article id="articleContent" style="display:none">
    <div style="margin-top:24px;">
        <a href="insight.html" style="font-size:12px;font-weight:700;color:var(--muted);display:inline-flex;align-items:center;gap:6px;">
            <i class="fa-solid fa-arrow-left"></i> Semua Artikel
        </a>
    </div>

    <div class="article-head">
        <div class="article-meta">
            <span class="article-cat" id="articleCategory"></span>
            <span class="article-date" id="articleDate"></span>
        </div>
        <h1 class="article-title" id="articleTitle"></h1>
        <div class="article-author">
            <span id="articleAuthor"></span>
        </div>
    </div>

    <div class="article-body" id="articleBody"></div>
    <div class="article-sources" id="articleSources"></div>

    <div class="panel cta">
        <span class="hint">Diskusi lebih lanjut soal artikel ini?</span>
        <a href="https://t.me/MARKETINSIGHT8" target="_blank" rel="noopener noreferrer">Join Telegram →</a>
    </div>
</article>

</main><footer class="wrap">MARKET INSIGHT · Independent Trading Intelligence &amp; Risk Management Platform<br>Konten edukasi, bukan nasihat atau rekomendasi investasi.</footer>

<!-- Centralized Navbar & Auth -->
<script src="js/navbar.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<script src="js/nav-auth.js"></script>

<script>
const $ = id => document.getElementById(id);

function formatDate(iso) {
    const d = new Date(iso + "T00:00:00");
    return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
}
function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}

const params = new URLSearchParams(window.location.search);
const id = params.get('id');

fetch('articles.json')
    .then(res => res.json())
    .then(data => {
        const article = (data.articles || []).find(a => a.id === id);
        $('loadingState').style.display = 'none';

        if (!article) {
            $('notFoundState').style.display = 'block';
            return;
        }

        document.title = article.title + " | MARKET INSIGHT";
        $('articleCategory').textContent = article.category;
        $('articleDate').textContent = formatDate(article.date);
        $('articleTitle').textContent = article.title;
        $('articleAuthor').textContent = article.author;

        $('articleBody').innerHTML = (article.content || []).map(p => `<p>${escapeHtml(p)}</p>`).join('');

        if (article.sources && article.sources.length) {
            $('articleSources').innerHTML = "Sumber: " + article.sources.map(s => escapeHtml(s)).join(', ');
        }

        $('articleContent').style.display = 'block';
    })
    .catch(err => {
        $('loadingState').style.display = 'none';
        $('notFoundState').style.display = 'block';
        console.error(err);
    });
</script>
</body>
</html>
