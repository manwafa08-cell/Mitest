<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080b12">
<title>Market Insight | MARKET INSIGHT</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#080b12;--cyan:#00f0ff;--muted:#8793a5;--line:rgba(255,255,255,.09);--panel:rgba(255,255,255,.035);--green:#20d6a0;--red:#ff667d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f4f7fb;font-family:"Plus Jakarta Sans",sans-serif;background-image:radial-gradient(ellipse at 50% -15%,rgba(0,240,255,.13),transparent 45%)}
a{color:inherit;text-decoration:none}.wrap{width:min(1160px,calc(100% - 40px));margin:auto}

/* Compatibility styles for #navAuthArea (non-Tailwind page) */
#navAuthArea{display:flex;align-items:center;gap:12px}
#navAuthArea a[href="login.html"],#navAuthArea a[href="settings.html"]{color:#9ca3af;font-size:.875rem;font-weight:600;transition:color .2s}
#navAuthArea a[href="login.html"]:hover,#navAuthArea a[href="settings.html"]:hover{color:#00f0ff}
#navAuthArea a[href="register.html"]{font-size:.75rem;font-weight:700;padding:8px 16px;border-radius:9999px;background:#00f0ff;color:#080b12;transition:background .2s}
#navAuthArea a[href="register.html"]:hover{background:#00d5e3}
#navAuthArea span{color:#d1d5db;font-size:.875rem;font-weight:600}
#navLogoutBtn{font-size:.75rem;font-weight:700;padding:8px 16px;border-radius:9999px;border:1px solid rgba(0,240,255,.3);background:transparent;color:#00f0ff;transition:all .2s;cursor:pointer}
#navLogoutBtn:hover{background:#00f0ff;color:#080b12}
@media(max-width:640px){#navAuthArea span,#navLogoutBtn span{display:none}}

.hero{text-align:center;padding:55px 0 35px}.badge{display:inline-flex;padding:8px 13px;border:1px solid rgba(0,240,255,.2);border-radius:30px;color:var(--cyan);font-size:10px;letter-spacing:.16em;font-weight:800;text-transform:uppercase;background:rgba(0,240,255,.06)}
h1{font-size:clamp(34px,5vw,55px);line-height:1.08;margin:19px 0 14px;font-weight:800;letter-spacing:-.04em}.gradient{background:linear-gradient(90deg,#fff,var(--cyan),#548bff);-webkit-background-clip:text;background-clip:text;color:transparent}
.subtitle{max-width:720px;margin:auto;color:var(--muted);font-size:14px;line-height:1.8}
.panel{background:linear-gradient(145deg,rgba(255,255,255,.055),rgba(255,255,255,.018));border:1px solid var(--line);border-radius:17px;padding:20px;backdrop-filter:blur(14px);min-width:0}
.label{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:800}.hint{font-size:10px;color:var(--muted);line-height:1.6}.cyan{color:var(--cyan)}.green{color:var(--green)}.red{color:var(--red)}
.section{margin-top:18px}
/* Filters */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 22px}
.filter-btn{border:1px solid rgba(0,240,255,.25);background:rgba(0,240,255,.05);color:var(--muted);padding:8px 15px;border-radius:30px;font-size:11px;font-weight:700;cursor:pointer}
.filter-btn.active{background:var(--cyan);color:var(--bg);border-color:var(--cyan)}
.filter-btn:hover:not(.active){color:var(--cyan)}
/* Article grid */
.article-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}
.article-card{display:flex;flex-direction:column;height:100%}
.article-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px;flex-wrap:wrap}
.article-cat{font-size:10px;font-weight:800;color:var(--cyan);text-transform:uppercase;letter-spacing:.08em;background:rgba(0,240,255,.08);border:1px solid rgba(0,240,255,.2);border-radius:20px;padding:4px 10px}
.article-date{font-size:10px;color:var(--muted)}
.article-title{font-size:16px;font-weight:800;margin:0 0 10px;line-height:1.4}
.article-excerpt{font-size:12px;color:var(--muted);line-height:1.7;margin:0 0 16px;flex:1}
.article-bottom{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted)}
.article-link{color:var(--cyan);font-weight:800}
.empty{text-align:center;color:var(--muted);padding:60px 0;font-size:13px}
footer{margin-top:55px;padding:25px 0;border-top:1px solid var(--line);text-align:center;color:#657184;font-size:10px;line-height:1.8}
@media(max-width:700px){.article-grid{grid-template-columns:1fr}}
@media(max-width:560px){.wrap{width:calc(100% - 28px)}.hero{padding:42px 0 28px}.panel{padding:15px}}
</style>
</head>
<body>

<!-- Centralized Navigation -->
<div id="app-navbar"></div>

<main class="wrap">
<section class="hero"><div class="badge">Market Insight</div><h1>Edukasi &amp; <span class="gradient">Analisis Market</span></h1>
<p class="subtitle">Artikel singkat seputar market update, analisis teknikal, dan manajemen risiko.</p></section>

<div class="filters" id="filterBar"></div>

<div class="article-grid" id="articleGrid"></div>
<div class="empty" id="emptyState" style="display:none">Belum ada artikel di kategori ini.</div>

</main><footer class="wrap">MARKET INSIGHT · Independent Trading Intelligence &amp; Risk Management Platform<br>Konten edukasi, bukan nasihat atau rekomendasi investasi.</footer>

<!-- Centralized Navbar & Auth -->
<script src="js/navbar.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<script src="js/nav-auth.js"></script>

<script>
const $ = id => document.getElementById(id);

let allArticles = [];
let activeCategory = "all";

function formatDate(iso) {
    const d = new Date(iso + "T00:00:00");
    return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
}

function renderFilters() {
    const cats = ["all", ...new Set(allArticles.map(a => a.category))];
    $('filterBar').innerHTML = cats.map(cat => {
        const label = cat === "all" ? "Semua" : cat;
        const cls = cat === activeCategory ? "filter-btn active" : "filter-btn";
        return `<button data-cat="${cat}" class="${cls}">${label}</button>`;
    }).join('');

    $('filterBar').querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            activeCategory = btn.dataset.cat;
            renderFilters();
            renderGrid();
        });
    });
}

function renderGrid() {
    const grid = $('articleGrid');
    const empty = $('emptyState');
    const filtered = activeCategory === "all" ? allArticles : allArticles.filter(a => a.category === activeCategory);
    const sorted = [...filtered].sort((a, b) => new Date(b.date) - new Date(a.date));

    if (sorted.length === 0) {
        grid.innerHTML = "";
        empty.style.display = "block";
        return;
    }
    empty.style.display = "none";

    grid.innerHTML = sorted.map(a => `
        <a href="artikel.html?id=${encodeURIComponent(a.id)}" class="panel article-card">
            <div class="article-top">
                <span class="article-cat">${a.category}</span>
                <span class="article-date">${formatDate(a.date)}</span>
            </div>
            <h3 class="article-title">${a.title}</h3>
            <p class="article-excerpt">${a.excerpt}</p>
            <div class="article-bottom">
                <span>${a.author}</span>
                <span class="article-link">Baca →</span>
            </div>
        </a>`).join('');
}

fetch('articles.json')
    .then(res => res.json())
    .then(data => {
        allArticles = data.articles || [];
        renderFilters();
        renderGrid();
    })
    .catch(err => {
        $('articleGrid').innerHTML = `<div class="empty" style="grid-column:1/-1">Gagal memuat artikel. Pastikan file articles.json ada di folder yang sama.</div>`;
        console.error(err);
    });
</script>
</body>
</html>
